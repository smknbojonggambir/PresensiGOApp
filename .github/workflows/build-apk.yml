name: Build PresensiGO Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 📝 Configure Environment & gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

      - name: 🔨 Compile Android Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: 🔍 Check Generated APK Files
        run: |
          ls -la app/build/outputs/apk/debug/ || find . -name "*.apk"

      - name: 🚀 Upload PresensiGO APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PresensiGO-SMKN-Bojonggambir-v2.4.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 60
