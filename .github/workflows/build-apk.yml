name: Build PresensiGO Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure gradle.properties (Enable AndroidX & Suppress SDK Warning)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> ~/.gradle/gradle.properties
          
          # Pastikan file gradle.properties di direktori proyek juga terisi
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
            gradle assembleDebug --stacktrace || ./gradlew assembleDebug
          fi

      - name: Upload PresensiGO APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PresensiGO-SMKN-Bojonggambir-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30
